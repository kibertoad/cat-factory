<!-- Early SPA loading shell painted before the JS bundle parses + Vue mounts
     (Nuxt removes it on mount). Self-contained: main.css/icon fonts aren't loaded
     yet, so styles + markup are inline pure-CSS. The only copy is the "Cat Factory"
     brand name (a proper noun, identical in every locale) so it stays locale-neutral.
     Wired via app.spaLoadingTemplate in nuxt.config.ts. -->
<div class="cf-spa-loader" role="status" aria-label="Cat Factory is starting">
  <!-- Wear the ACTIVE theme, not the default: the theme plugin caches the computed colours of the
       few tokens this shell paints with, per colour mode, under `cf-boot-palette` (see
       utils/theme/bootPalette.ts). The colour-mode script in <head> has already classed <html>, so
       pick that mode's entry; a mode never seen since the theme was picked keeps the defaults below.
       Values are computed colours applied through setProperty, so nothing here can be injected. -->
  <script>
    ;(function () {
      try {
        var mode = document.documentElement.classList.contains('light') ? 'light' : 'dark'
        var palette = JSON.parse(localStorage.getItem('cf-boot-palette') || '{}')[mode]
        if (!palette) return
        var el = document.currentScript.parentElement
        var slots = ['bg', 'track', 'accent', 'status']
        for (var i = 0; i < slots.length; i++) {
          if (typeof palette[slots[i]] === 'string') {
            el.style.setProperty('--cf-' + slots[i], palette[slots[i]])
          }
        }
      } catch (e) {
        /* storage unavailable: the shell keeps its default colours */
      }
    })()
  </script>
  <div class="cf-spa-loader__badge">
    <div class="cf-spa-loader__ring"></div>
    <!-- Cat face, drawn inline so it paints without the icon font. -->
    <svg class="cf-spa-loader__cat" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M4 4l3 3.2A7.5 7.5 0 0 1 12 6c1.9 0 3.6.5 5 1.2L20 4v8a8 8 0 0 1-16 0V4z"
        fill="currentColor"
      />
      <circle cx="9" cy="11.5" r="1.1" />
      <circle cx="15" cy="11.5" r="1.1" />
      <path
        d="M10.6 14.4c.4.5 2.4.5 2.8 0"
        stroke="currentColor"
        stroke-width="1"
        stroke-linecap="round"
      />
    </svg>
  </div>
  <div class="cf-spa-loader__text">
    <span class="cf-spa-loader__brand">Cat Factory</span>
    <span class="cf-spa-loader__status">
      is starting<span class="cf-spa-loader__dots"><i>.</i><i>.</i><i>.</i></span>
    </span>
  </div>
</div>
<style>
  .cf-spa-loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    /* Defaults are the default theme's tokens (slate-950 / slate-200 canvas, indigo primary),
       hardcoded because main.css is not loaded yet; the inline script above overrides the
       `--cf-*` slots with the active theme's cached colours when it has them. */
    --cf-bg: #020618;
    --cf-track: #1e293b;
    --cf-accent: #818cf8;
    --cf-status: #94a3b8;
    background-color: var(--cf-bg);
    font-family:
      ui-sans-serif,
      system-ui,
      -apple-system,
      'Segoe UI',
      Roboto,
      sans-serif;
  }
  .cf-spa-loader__badge {
    position: relative;
    width: 5rem;
    height: 5rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cf-spa-loader__ring {
    position: absolute;
    inset: 0;
    border-radius: 9999px;
    /* Track in the border token, the active arc in the primary. */
    border: 3px solid var(--cf-track);
    border-top-color: var(--cf-accent);
    animation: cf-spa-spin 1s linear infinite;
  }
  .cf-spa-loader__cat {
    width: 2.5rem;
    height: 2.5rem;
    color: var(--cf-accent);
    animation: cf-spa-bob 1.6s ease-in-out infinite;
  }
  .cf-spa-loader__text {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
  }
  .cf-spa-loader__brand {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--cf-accent);
  }
  .cf-spa-loader__status {
    font-size: 0.875rem;
    color: var(--cf-status);
  }
  /* Light colour mode: the canvas and the two neutral shades flip; the indigo accents stay. */
  html.light .cf-spa-loader {
    --cf-bg: #e2e8f0;
    --cf-track: #cbd5e1;
    --cf-accent: #6366f1;
    --cf-status: #64748b;
  }
  .cf-spa-loader__cat circle,
  .cf-spa-loader__cat path[stroke] {
    fill: var(--cf-bg);
    stroke: var(--cf-bg);
  }
  .cf-spa-loader__dots i {
    font-style: normal;
    animation: cf-spa-blink 1.4s infinite both;
  }
  .cf-spa-loader__dots i:nth-child(2) {
    animation-delay: 0.2s;
  }
  .cf-spa-loader__dots i:nth-child(3) {
    animation-delay: 0.4s;
  }
  @keyframes cf-spa-spin {
    to {
      transform: rotate(360deg);
    }
  }
  @keyframes cf-spa-bob {
    0%,
    100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-0.2rem);
    }
  }
  @keyframes cf-spa-blink {
    0%,
    100% {
      opacity: 0.2;
    }
    50% {
      opacity: 1;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .cf-spa-loader__ring,
    .cf-spa-loader__cat,
    .cf-spa-loader__dots i {
      animation: none;
    }
  }
</style>
