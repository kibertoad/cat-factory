[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cat-factory-sdk"
version = "0.5.0"
description = "Python client for the cat-factory public API (/api/v1): typed models and resource clients generated from the published OpenAPI spec, over a dependency-free urllib transport with bearer auth, bounded retries, keyset auto-pagination and an SSE reader for the run streams."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "cat-factory" }]
keywords = ["cat-factory", "sdk", "api-client", "openapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# Deliberately EMPTY. A client library's dependencies become every consumer's dependencies, and a
# transitive HTTP stack is the most common source of version conflicts in a Python application.
dependencies = []

[project.urls]
Homepage = "https://github.com/kibertoad/cat-factory"
Source = "https://github.com/kibertoad/cat-factory/tree/main/sdk/python"
Documentation = "https://github.com/kibertoad/cat-factory/blob/main/backend/docs/public-api.md"

[tool.hatch.build.targets.wheel]
packages = ["cat_factory"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
