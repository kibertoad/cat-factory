name: Stories

# Every component story rendered in headless Chromium, with an axe check, deliberately kept OUT of
# `ci.yml`.
#
# The whole tree takes about 10 minutes: each stories file boots the story's Nuxt app in a fresh
# browser page, and that setup is most of the time. That is the wrong shape for a per-PR gate, so
# it runs here, nightly plus on manual dispatch, and it is NON-BLOCKING by construction: a separate
# workflow contributes no check to `ci.yml`'s aggregated gates. What every PR does get, in
# `ci.yml`, is the cheap half: the stories typecheck with the app, `fixtures.spec.ts` parses every
# shared fixture in the app's unit tests, and `check-story-titles.mjs` runs with the guards.
#
# Running without browser isolation took about 2 minutes and was rejected: with the files
# shuffled, 2 of 4 runs timed out on stories that pass alone. Setup, conventions and helpers:
# docs/internal/storybook.md.

on:
  # Nightly, off-peak, and away from the mutation run's slot. Scheduled runs only fire on the
  # default branch.
  schedule:
    - cron: '50 2 * * *'
  # A change to the story lane ITSELF runs it on the PR making the change, so a broken config is
  # found before it merges rather than as a red nightly on main: the Storybook package and its
  # dependencies, the shared story helpers, the patch and where it is registered, and the lockfile
  # (a dependency sweep changes only that and the package files). An ordinary PR pays nothing.
  pull_request:
    paths:
      - '.github/workflows/stories.yml'
      - 'frontend/storybook/**'
      - 'frontend/app/app/stories/**'
      - 'frontend/app/package.json'
      - 'patches/@storybook-vue__nuxt@*.patch'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: stories-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  stories:
    name: Render every story (${{ matrix.attempt }})
    # A release PR changes only package versions, which match the paths filter above, and runs the
    # same code the nightly already checks.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6]
    # About 10 minutes on a developer laptop; bounded so a story that hangs the browser cannot burn
    # the runner for hours.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'true'

      # The stories import the built `dist` of the workspace packages the SPA depends on
      # (`@cat-factory/contracts` among them), so build exactly those.
      - name: Build the SPA's workspace dependencies
        run: pnpm exec turbo run build --filter='@cat-factory/storybook^...'

      # The same cache the e2e lane uses: one Playwright version is pinned in the lockfile for both.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Through the e2e package, as `ci.yml` does: it declares `@playwright/test`, so the `playwright`
      # binary is linked there, where `frontend/storybook` only has it transitively.
      - name: Install Playwright Chromium
        if: ${{ steps.pw-cache.outputs.cache-hit != 'true' }}
        run: pnpm --filter @cat-factory/e2e exec playwright install --with-deps chromium

      # The step below depends on a variable Vitest reads but does not document, so check that the
      # installed Vitest still reads it. Without it, the lane passes locally and swaps in CI.
      - name: Check that Vitest still collects garbage between files
        working-directory: frontend/storybook
        run: |
          dist="$(dirname "$(node -p "require.resolve('vitest/package.json')")")/dist"
          grep -rqF VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB "$dist" || {
            echo "::error::Vitest no longer reads VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB. See docs/internal/storybook.md."
            exit 1
          }

      - name: Render every story
        # A full garbage collection in each session's renderer after every stories file. Each file
        # runs in a new iframe and leaves its module graph as garbage, which V8 collects late, so the
        # three renderers grew to about 5 GB each, the 16 GB runner swapped, and a story stalled for
        # 42 s. Vitest runs this collection after a file when `/tmp` has less free space than this
        # many GB (`maybeCollectChromiumGarbage` in vitest's `src/node/pools/browser.ts`, Linux and
        # Chromium only), so a size larger than any disk runs it after every file.
        env:
          VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: '100000'
          DEBUG: vitest:browser:gc
          MSWLOG: ${{ runner.temp }}/beacons.jsonl
        run: |
          ( while true; do
              m=$(free -m | awk '/Mem:/{print $3"/"$7} /Swap:/{print "swap="$3}' | tr '\n' ' ')
              r=$(ps -eo rss,args | grep -- '--type=renderer' | grep -v grep | awk '{printf "%d ", $1/1024}')
              v=$(vmstat 1 2 | tail -1 | awk '{print "si="$7" so="$8}')
              echo "$(date +%s%3N) used/avail=$m $v renderers=[$r]"
              sleep 4
            done ) > ${{ runner.temp }}/mem.log 2>&1 &
          rc=0
          (cd frontend/storybook && pnpm exec vitest run --config vitest.stories.config.ts --reporter=default --reporter=json --outputFile.json=${{ runner.temp }}/run.json) > ${{ runner.temp }}/stories.log 2>&1 || rc=$?
          sed 's/\x1b\[[0-9;]*m//g' ${{ runner.temp }}/stories.log | grep -vE 'vitest:browser:gc' | tail -40; exit $rc

      - name: Upload the run logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stories-gc-${{ matrix.attempt }}
          path: |
            ${{ runner.temp }}/stories.log
            ${{ runner.temp }}/mem.log
            ${{ runner.temp }}/run.json
            ${{ runner.temp }}/beacons.jsonl
